<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="100%" style="stop-color:#fbcfe8"/>
    </linearGradient>
    <linearGradient id="papaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Papaya body -->
  <ellipse cx="256" cy="280" rx="120" ry="140" fill="url(#papaya)"/>
  <!-- Papaya face -->
  <circle cx="220" cy="260" r="12" fill="#1f2937"/>
  <circle cx="292" cy="260" r="12" fill="#1f2937"/>
  <path d="M 220 310 Q 256 330 292 310" stroke="#1f2937" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <ellipse cx="256" cy="150" rx="35" ry="50" fill="#4ade80" transform="rotate(-20 256 150)"/>
  <ellipse cx="256" cy="150" rx="35" ry="50" fill="#22c55e" transform="rotate(20 256 150)"/>
  <!-- Cheeks -->
  <circle cx="180" cy="290" r="20" fill="#fca5a5" opacity="0.6"/>
  <circle cx="332" cy="290" r="20" fill="#fca5a5" opacity="0.6"/>
</svg>
